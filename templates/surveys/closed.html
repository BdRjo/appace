<!DOCTYPE html>
{%- set ar = (current_lang == 'ar') -%}
<html lang="{{ current_lang }}" dir="{{ 'rtl' if ar else 'ltr' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ survey.name }}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: {{ "'Tajawal', " if ar }}sans-serif; background: linear-gradient(160deg,#f5f3ff,#faf5ff 60%,#fff); min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card-box { max-width: 420px; width: 100%; background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(124,58,237,.14); padding: 36px 26px; text-align: center; }
  .icn { font-size: 2.4rem; color: #9ca3af; }
  h1 { font-size: 1.1rem; font-weight: 800; color: #1f2937; margin: 12px 0 6px; }
  .sub { font-size: .86rem; color: #6b7280; }
</style>
</head>
<body>
<div class="card-box">
  <i class="bi bi-hourglass-split icn"></i>
  <h1>{{ survey.name }}</h1>
  <div class="sub">{{ message }}</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html id="pubHtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Public Calendar — ARS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css">
<style>
/* الأنماط الأساسية للواجهة (لم تتغير كثيراً) */
body{background:#f0f4f8;font-family:'Segoe UI',Tahoma,sans-serif;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#mainContent{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:8px 12px}
#calendarContainer{flex:1;overflow:hidden;display:flex;flex-direction:column}
.pcal-card{flex:1;overflow:hidden;display:flex;flex-direction:column;border-radius:14px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.07);background:white}
#calendar{flex:1}
#mobileList{flex:1;overflow-y:auto;padding-bottom:4px}
.pcal-nav{background:#0C67EC;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:200}
.pcal-brand{color:white;font-weight:800;font-size:.92rem;display:flex;align-items:center;gap:7px}
.pcal-clock{color:rgba(255,255,255,.9);font-size:.7rem;flex:1;text-align:center}
.pcal-lang{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:white;border-radius:7px;padding:3px 10px;font-size:.76rem;font-weight:600;text-decoration:none}
.pcal-lang:hover{background:rgba(255,255,255,.3);color:white}
.vbadge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:.74rem;font-weight:600;background:#e8f0ff;color:#0C67EC;border:1px solid #b8d0ff;cursor:pointer;transition:.15s;white-space:nowrap;margin:2px}
.vbadge.active,.vbadge:hover{background:#0C67EC;color:white;border-color:#0C67EC}
.bcard{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:10px;cursor:pointer;border:2px solid transparent;transition:.15s}
.bcard:hover{border-color:#0C67EC}
.bcard-title{font-weight:700;color:#1e293b;font-size:.9rem}
.bcard-meta{font-size:.78rem;color:#64748b;margin-top:3px}
.status-pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:700;background:#d1fae5;color:#065f46}
.dp-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:.83rem}
.dp-row:last-child{border-bottom:none}
.dp-label{color:#64748b;font-weight:600}
.dp-value{color:#1e293b;font-weight:500;text-align:end}
.pcal-card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.fc{font-size:.82rem}
.fc-col-header-cell{background:#0C67EC!important;padding:7px 0!important}
.fc-col-header-cell-cushion{color:#fff!important;font-weight:700!important;text-decoration:none!important}
.fc-toolbar-title{color:#0C67EC!important;font-weight:800!important;font-size:.95rem!important}
.fc-button-primary{background:#0C67EC!important;border-color:#0C67EC!important;font-size:.78rem!important}
.fc-button-primary:hover{background:#0847B0!important;border-color:#0847B0!important}
.fc-day-today{background:rgba(92,155,222,.1)!important}
.fc-event{border-radius:5px!important;font-size:.71rem!important;cursor:pointer!important}
.pcal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;padding:12px}
.pcal-overlay.open{display:flex}
.pcal-modal{background:white;border-radius:18px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.pcal-mhead{background:#0C67EC;color:white;padding:14px 18px;border-radius:18px 18px 0 0;display:flex;align-items:center;justify-content:space-between}
.pcal-mhead h6{margin:0;font-weight:800;font-size:.9rem}
.pcal-mbody{padding:16px}
.msec-title{font-size:.7rem;font-weight:700;color:#0C67EC;letter-spacing:.5px;text-transform:uppercase;padding-bottom:5px;border-bottom:2px solid #e8f0ff;margin-bottom:8px;margin-top:14px}
.msec-title:first-child{margin-top:0}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f8fafc;font-size:.83rem}
.mrow:last-child{border-bottom:none}
.mlabel{color:#64748b;font-weight:600;display:flex;align-items:center;gap:5px}
.mvalue{color:#1e293b;font-weight:500;text-align:end}
.mstatus{padding:3px 11px;border-radius:20px;font-size:.73rem;font-weight:700;background:#d1fae5;color:#065f46}
.mclosebtn{background:rgba(255,255,255,.2);border:none;color:white;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.loading{text-align:center;padding:40px;color:#64748b}
.empty{text-align:center;padding:40px;color:#94a3b8;font-size:.85rem}
@media(max-width:575px){.pcal-brand span{display:none}}
}
</style>
</head>
<body>

<nav class="pcal-nav">
  <div class="pcal-brand">
    <img src="https://i.postimg.cc/FR6j033B/acs.png" style="height:32px;border-radius:6px" alt="logo" onerror="this.style.display='none'">
    <span id="brandText"></span>
  </div>
  <div class="pcal-clock" id="clockEl"></div>
  <div class="d-flex gap-2 align-items-center">
    <a href="{{ url_for('public_cal.book') }}" style="background:white;color:#0C67EC;border-radius:8px;padding:4px 12px;font-size:.78rem;font-weight:700;text-decoration:none;white-space:nowrap">
      <i class="bi bi-plus-circle me-1"></i><span id="bookBtnText"></span>
    </a>
    <a id="langBtn" href="#" class="pcal-lang"></a>
  </div>
</nav>

<div id="mainContent" class="container-fluid" style="max-width:1100px;margin:0 auto">
  <div class="d-flex flex-wrap align-items-center gap-1 mb-3">
    <span id="filterLabel" style="color:#64748b;font-weight:600;font-size:.78rem;margin-inline-end:4px"></span>
    <span class="vbadge active" id="v_all" onclick="filterVenue('')"></span>
    {% for v in venues %}
    <span class="vbadge" id="v_{{ v.id }}" onclick="filterVenue('{{ v.id }}')">{{ v.name }}</span>
    {% endfor %}
  </div>

  <div id="mobileView" class="d-flex d-md-none flex-column" style="flex:1;overflow:hidden">
    <div id="bookingsList" class="mobileList"><div class="loading"><div class="spinner-border text-primary"></div></div></div>
  </div>

  <div id="desktopView" class="d-none d-md-flex" style="flex:1;flex-direction:column;overflow:hidden">
    <div class="pcal-card"><div id="calendar" style="height:100%"></div></div>
  </div>

  <div class="d-flex flex-wrap justify-content-center gap-3 mt-2 mb-1" style="font-size:.72rem;color:#64748b">
    <span><span style="display:inline-block;width:12px;height:12px;background:#3D8EF5;border-radius:3px;margin-inline-end:4px"></span>{% if ar %}معتمد{% else %}Approved{% endif %}</span>
    <span><span style="display:inline-block;width:12px;height:12px;background:#F59E0B;border-radius:3px;margin-inline-end:4px"></span>{% if ar %}قيد المراجعة{% else %}Pending{% endif %}</span>
    <span><span style="display:inline-block;width:12px;height:12px;background:#EF4444;border-radius:3px;margin-inline-end:4px"></span>{% if ar %}محظور{% else %}Blocked{% endif %}</span>
  </div>
  <div class="text-center mt-1" id="footNote" style="font-size:.7rem;color:#94a3b8"></div>
</div>

<div class="pcal-overlay" id="pcalOverlay" onclick="overlayClick(event)">
  <div class="pcal-modal">
    <div class="pcal-mhead">
      <h6 id="modalTitle"></h6>
      <div class="d-flex gap-2 align-items-center">
        <button onclick="printBooking()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:white;border-radius:8px;padding:4px 12px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:5px">
          <i class="bi bi-printer"></i> {{ 'Print' if current_lang == 'en' else 'طباعة' }}
        </button>
        <button class="mclosebtn" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="pcal-mbody" id="modalBody"></div>
  </div>
</div>

<script>
const LANG = '{{ current_lang }}';
const AR   = LANG === 'ar';
const MOBILE = window.innerWidth < 768;

document.getElementById('pubHtml').lang = AR ? 'ar' : 'en';
document.getElementById('pubHtml').dir  = AR ? 'rtl' : 'ltr';

const T = {
  brand:    AR?'الجمعية الثقافية العربية':'Arab Cultural Society',
  all:      AR?'الكل':'All',
  filter:   AR?'فلترة:':'Filter:',
  foot:     AR?'يعرض الحجوزات المعتمدة والمعلقة':'Showing approved and pending reservations',
  empty:    AR?'لا توجد حجوزات':'No reservations',
  lang:     AR?'EN':'ع',
  bookNo:   AR?'رقم الحجز':'Booking No.',
  titleL:   AR?'العنوان':'Title',
  status:   AR?'الحالة':'Status',
  start:    AR?'البداية':'Start',
  end:      AR?'الانتهاء':'End',
  venue:    AR?'القاعة':'Venue',
  capacity: AR?'السعة':'Capacity',
  location: AR?'الموقع':'Location',
  approved: AR?'معتمد':'Approved',
  bookInfo: AR?'معلومات الحجز':'Booking Info',
  venueInfo:AR?'معلومات القاعة':'Venue Info',
  failLoad: AR?'تعذر تحميل البيانات':'Failed to load',
  month:    AR?'شهر':'Month',
  list:     AR?'قائمة':'List',
  details:  AR?'تفاصيل الحجز':'Booking Details',
  attendees:AR?'الحضور':'Attendees',
};

document.getElementById('brandText').textContent   = T.brand;
document.getElementById('filterLabel').textContent  = T.filter;
document.getElementById('v_all').textContent        = T.all;
document.getElementById('footNote').textContent     = T.foot;
document.getElementById('langBtn').textContent      = T.lang;
document.getElementById('langBtn').href = `/set-lang/${AR?'en':'ar'}?next=/public-calendar/`;
document.getElementById('bookBtnText').textContent  = AR ? 'احجز الآن' : 'Book Now';
document.getElementById('modalTitle').innerHTML = `<i class="bi bi-calendar-check me-2"></i>${T.details}`;

function tick(){
  const n = new Date();
  document.getElementById('clockEl').textContent =
    n.toLocaleDateString(AR?'ar-SA':'en-US',{weekday:'short',day:'numeric',month:'short'}) + '  ' +
    n.toLocaleTimeString(AR?'ar-SA':'en-US',{hour:'2-digit',minute:'2-digit'});
}
tick(); setInterval(tick,1000);
setTimeout(()=> window.location.reload(), 30 * 60 * 1000);

let currentVenue = '';

function filterVenue(vid){
  currentVenue = vid;
  document.querySelectorAll('.vbadge').forEach(b=>b.classList.remove('active'));
  document.getElementById(vid?'v_'+vid:'v_all').classList.add('active');
  if(MOBILE) loadCards();
  else if(window._cal) window._cal.refetchEvents();
}

function loadCards(){
  const listDiv = document.getElementById('bookingsList');
  if(!listDiv) return;
  listDiv.innerHTML = '<div class="loading"><div class="spinner-border text-primary"></div></div>';
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth()-1, 1).toISOString().slice(0,10);
  const end   = new Date(now.getFullYear(), now.getMonth()+3, 0).toISOString().slice(0,10);
  fetch(`/public-calendar/events?start=${start}&end=${end}&venue_id=${currentVenue}`)
    .then(r=>r.json())
    .then(data=>{
      if(!data.length){ listDiv.innerHTML = `<div class="empty">${T.empty}</div>`; return; }
      listDiv.innerHTML = data.map(b=>`
        <div class="bcard" id="card_${b.id}" onclick="toggleDetail(${b.id})">
          <div class="d-flex justify-content-between align-items-start">
            <div class="bcard-title">${escapeHtml(b.title||'—')}</div>
            <span class="status-pill">${T.approved}</span>
          </div>
          <div class="bcard-meta"><i class="bi bi-calendar3 me-1"></i>${(b.start||'').slice(0,10)}</div>
          <div id="detail_${b.id}" style="display:none;margin-top:10px;border-top:1px solid #f1f5f9;padding-top:10px"></div>
        </div>`).join('');
    })
    .catch(()=>{ listDiv.innerHTML = `<div class="empty">${T.failLoad}</div>`; });
}

function toggleDetail(id){
  const el = document.getElementById('detail_'+id);
  const card = document.getElementById('card_'+id);
  if(el.style.display!=='none'){ el.style.display='none'; card.style.borderColor='transparent'; return; }
  document.querySelectorAll('[id^="detail_"]').forEach(e=>e.style.display='none');
  document.querySelectorAll('.bcard').forEach(c=>c.style.borderColor='transparent');
  card.style.borderColor='#0C67EC';
  el.innerHTML='<div class="text-center py-2"><div class="spinner-border text-primary" style="width:1rem;height:1rem"></div></div>';
  el.style.display='block';
  fetch(`/public-calendar/booking/${id}`)
    .then(r=>r.json())
    .then(d=>{
      el.innerHTML = buildRows(d) + `<div style="margin-top:10px;text-align:center"><button onclick="printDetail(${id})" style="background:#0C67EC;color:white;border:none;border-radius:8px;padding:6px 16px;font-size:.78rem;cursor:pointer">🖨 ${AR?'طباعة':'Print'}</button></div>`;
    })
    .catch(()=>{ el.innerHTML=`<div class="text-danger" style="font-size:.8rem">${T.failLoad}</div>`; });
}

function _buildPrintWindow(d) {
  const dir      = AR ? 'rtl' : 'ltr';
  const orgName  = AR ? 'الجمعية الثقافية العربية' : 'Arab Cultural Society';
  const sysName  = AR ? 'نظام حجز القاعات والمرافق' : 'Venue & Facility Booking System';
  const logoSrc  = 'https://i.postimg.cc/FR6j033B/acs.png';
  const titleTxt = AR ? d.title : (d.title_en || d.title);
  const venueTxt = AR ? d.venue_name : (d.venue_name_en || d.venue_name);
  const printDate = new Date().toLocaleDateString(AR ? 'ar-SA' : 'en-US', {year:'numeric',month:'long',day:'numeric'});

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function row(lbl,val,bold){
    if(!val && val!==0) return '';
    return '<tr><td class="lb">'+lbl+'</td><td class="vl'+(bold?' bd':'')+'">'+esc(val)+'</td></tr>';
  }

  let bRows = row(AR?'رقم الحجز':'Booking No.', d.booking_number, true)
    + row(AR?'العنوان':'Title', titleTxt)
    + row(AR?'نوع الحجز':'Type', AR?d.booking_type_ar:d.booking_type_en)
    + row(AR?'الحالة':'Status', AR?d.status_ar:d.status_en);
  if(d.full_day) bRows += row(AR?'اليوم':'Date', d.date_only);
  else bRows += row(AR?'البداية':'Start',d.start_time)+row(AR?'النهاية':'End',d.end_time);
  bRows += row(AR?'عدد الحضور':'Attendees',d.expected_attendees)
    + row(AR?'مقدم الطلب':'Requested By',d.requester_name)
    + row(AR?'نيابةً عن':'On Behalf Of',d.on_behalf)
    + row(AR?'ملاحظات':'Notes',d.notes)
    + (d.approver_notes ? row(AR?'ملاحظات الاعتماد':'Approval Notes',d.approver_notes) : '');

  let vRows = row(AR?'القاعة':'Venue',venueTxt)
    + row(AR?'الطاقة الاستيعابية':'Capacity',d.venue_capacity)
    + row(AR?'الموقع':'Location',d.location_name)
    + (d.venue_equipment ? row(AR?'التجهيزات':'Equipment',d.venue_equipment) : '');

  return '<!DOCTYPE html><html lang="'+(AR?'ar':'en')+'" dir="'+dir+'">'
    +'<head><meta charset="UTF-8">'
    +'<title>'+orgName+'</title>'
    +'<style>'
    +'*{box-sizing:border-box;margin:0;padding:0}'
    +'body{font-family:'+(AR?'Tahoma,Arial':'Segoe UI,Arial')+',sans-serif;direction:'+dir+';color:#1e293b;background:white}'
    +'.ph{background:#0C67EC;color:white;display:flex;align-items:center;gap:12px;padding:14px 20px}'
    +'.ph img{height:50px;border-radius:7px;background:white;padding:2px}'
    +'.ph .on{font-size:16px;font-weight:800}'
    +'.ph .sn{font-size:11px;opacity:.85;margin-top:2px}'
    +'.pb{padding:18px 20px}'
    +'.sc{font-weight:700;color:#0C67EC;font-size:12px;padding:6px 0 4px;border-bottom:2px solid #dbeafe;margin:14px 0 7px}'
    +'table{width:100%;border-collapse:collapse}'
    +'tr{border-bottom:1px solid #f1f5f9}'
    +'td{padding:8px 6px;font-size:13px;vertical-align:top}'
    +'.lb{color:#64748b;font-weight:600;width:38%}'
    +'.vl{color:#1e293b}'
    +'.bd{color:#0C67EC;font-weight:800;font-size:14px}'
    +'.ft{margin-top:18px;padding-top:8px;border-top:1px solid #e2e8f0;text-align:center;font-size:11px;color:#94a3b8}'
    +'@media print{.ph{-webkit-print-color-adjust:exact;print-color-adjust:exact}}'
    +'</style></head>'
    +'<body>'
    +'<div class="ph"><img src="'+logoSrc+'" id="lg"><div><div class="on">'+orgName+'</div><div class="sn">'+sysName+'</div></div></div>'
    +'<div class="pb">'
    +'<div class="sc">📅 '+(AR?'معلومات الحجز':'Booking Info')+'</div>'
    +'<table>'+bRows+'</table>'
    +'<div class="sc">🏢 '+(AR?'معلومات القاعة':'Venue Info')+'</div>'
    +'<table>'+vRows+'</table>'
    +'<div class="ft">ARS · '+(AR?'طُبع بتاريخ':'Printed on')+' '+printDate+'</div>'
    +'</div>'
    +'<script>'
    +'var i=document.getElementById("lg"),p=false;'
    +'function go(){if(!p){p=true;window.print();}}'
    +'if(i.complete){setTimeout(go,400);}else{i.onload=go;i.onerror=go;setTimeout(go,3000);}'
    +'<\/script>'
    +'</body></html>';
}

async function printDetail(id){
  if(window._isPrinting) return;
  window._isPrinting = true;
  try {
    const res  = await fetch('/public-calendar/booking/'+id);
    const data = await res.json();
    const win  = window.open('','_blank');
    if(!win){ alert(AR?'يرجى السماح بالنوافذ المنبثقة':'Please allow popups'); window._isPrinting=false; return; }
    win.document.write(_buildPrintWindow(data));
    win.document.close();
  } catch(e){
    alert(AR?'تعذّر تحميل البيانات':'Failed to load data');
  }
  window._isPrinting = false;
}

function printBooking(){
  const d = window._printData;
  if(!d){ alert(AR?'لا توجد بيانات':'No data'); return; }
  if(window._isPrinting) return;
  window._isPrinting = true;
  const win = window.open('','_blank');
  if(!win){ alert(AR?'يرجى السماح بالنوافذ المنبثقة':'Please allow popups'); window._isPrinting=false; return; }
  win.document.write(_buildPrintWindow(d));
  win.document.close();
  window._isPrinting = false;
}


document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

if (MOBILE) {
  loadCards();
} else {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.8/index.global.min.js';
  s.onload = initDesktopCalendar;
  document.head.appendChild(s);
}
</script>
</body>
</html>

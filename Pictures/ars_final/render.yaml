services:
  - type: web
    name: ars-reservation-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ars-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: ars-db
    databaseName: ars_venues
    user: ars_user
    plan: free

{% extends "base.html" %}
{% block title %}التقويم — ARS{% endblock %}
{% block extra_css %}
<!-- FullCalendar 6 global bundle includes CSS via JS -->
<style>
.filter-btn { border-radius:20px; font-size:.78rem; padding:4px 14px; border:2px solid transparent; cursor:pointer; font-weight:600; transition:.2s; }
.filter-btn.active { border-color:#1A555C; background:#1A555C; color:#fff; box-shadow:0 3px 8px rgba(26,85,92,.4); }
.filter-btn.f-all    { border-color:#6c757d; }
.filter-btn.f-mine   { border-color:#d97706; background:rgba(217,119,6,.1); color:#92400e; }
.filter-btn.f-mine.active { background:#d97706; color:#fff; box-shadow:0 3px 8px rgba(217,119,6,.4); }
.filter-btn.f-approved { border-color:#059669; background:rgba(5,150,105,.1); color:#065f46; }
.filter-btn.f-approved.active { background:#059669; color:#fff; box-shadow:0 3px 8px rgba(5,150,105,.4); }
.filter-btn.f-pending  { border-color:#D4A853; background:rgba(212,168,83,.1); color:#6b4400; }
.filter-btn.f-pending.active { background:#D4A853; color:#fff; box-shadow:0 3px 8px rgba(212,168,83,.4); }
.filter-btn.f-rejected { border-color:#7a6b00; background:rgba(180,160,0,.1); color:#5a4b00; }
.filter-btn.f-rejected.active { background:#7a6b00; color:#fff; box-shadow:0 3px 8px rgba(120,110,0,.4); }
.filter-btn.f-blocked  { border-color:#2E6B8A; background:rgba(46,107,138,.1); color:#1a3d50; }
.filter-btn.f-blocked.active  { background:#2E6B8A; color:#fff; box-shadow:0 3px 8px rgba(46,107,138,.4); }
.legend-dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
/* 3D Calendar Card */
#calendar { border-radius:12px; }
.fc { font-size:.84rem; }
.fc-daygrid-day { transition:.15s; }
.fc-daygrid-day:hover { background:rgba(26,85,92,.05)!important; }
.fc-day-today { background:rgba(212,168,83,.12)!important; border:2px solid #D4A853!important; border-radius:4px; }
.fc-event { border-radius:6px!important; padding:2px 5px!important; font-size:.75rem!important;
            box-shadow:0 2px 5px rgba(0,0,0,.25)!important; transition:.15s!important; }
.fc-event:hover { transform:translateY(-1px)!important; box-shadow:0 4px 10px rgba(0,0,0,.3)!important; }
.fc-col-header-cell { background:linear-gradient(180deg,#1A555C,#2E8B8F)!important; color:#fff!important; padding:8px 0!important; }
.fc-col-header-cell-cushion { color:#fff!important; font-weight:700!important; text-decoration:none!important; }
.fc-toolbar-title { color:#1A555C!important; font-weight:800!important; }
.fc-button-primary { background:#1A555C!important; border-color:#1A555C!important; }
.fc-button-primary:hover { background:#0f343a!important; border-color:#0f343a!important; }
.fc-button-active { background:#D4A853!important; border-color:#D4A853!important; }
</style>
{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-2">
  <h1><i class="bi bi-calendar3 me-2"></i><span data-i18n="t_calendar">التقويم التفاعلي</span></h1>
  <a href="{{ url_for('reservations.new') }}" class="btn btn-primary-ars">
    <i class="bi bi-plus-lg me-1"></i><span data-i18n="t_new_res">حجز جديد</span>
  </a>
</div>

<!-- Filters -->
<div class="card mb-3">
  <div class="card-body py-2">
    <div class="d-flex gap-2 align-items-center flex-wrap">
      <span class="small fw-bold text-muted me-1"><span data-i18n="t_filter_cal">تصفية:</span></span>
      <button class="filter-btn f-all active" data-filter="all">🗓 عرض الكل</button>
      <button class="filter-btn f-mine" data-filter="mine">👤 حجوزاتي</button>
      <button class="filter-btn f-approved" data-filter="approved">✅ المعتمدة</button>
      <button class="filter-btn f-pending" data-filter="pending">⏳ المعلقة</button>
      <button class="filter-btn f-rejected" data-filter="rejected">❌ المرفوضة</button>
      <button class="filter-btn f-blocked" data-filter="blocked">🚫 المحجوبة</button>
      <select id="venueFilter" class="form-select form-select-sm ms-auto" style="max-width:200px">
        <option value=""><span data-i18n="t_all_venues">كل القاعات</span></option>
        {% for v in venues %}
        <option value="{{ v.id }}">{{ v.name }}</option>
        {% endfor %}
      </select>
    </div>
    <!-- Legend -->
    <div class="d-flex gap-3 mt-2 flex-wrap small text-muted">
      <span><span class="legend-dot" style="background:#198754"></span> <span data-i18n="t_leg_avail">متاح/موافق</span></span>
      <span><span class="legend-dot" style="background:#FFC107"></span> <span data-i18n="t_my_res">حجوزاتي</span></span>
      <span><span class="legend-dot" style="background:#7a6b00"></span> <span data-i18n="t_leg_other">حجوزات أخرى</span></span>
      <span><span class="legend-dot" style="background:#2E6B8A"></span> <span data-i18n="t_leg_blocked">محجوب</span></span>
      <span><span class="legend-dot" style="background:#fd7e14"></span> <span data-i18n="t_leg_partial">جزئي/معلق</span></span>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-2">
    <div id="calendar"></div>
  </div>
</div>

<!-- Day detail modal -->
<div class="modal fade" id="dayModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="dayModalTitle"><span data-i18n="t_day_details">تفاصيل اليوم</span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="dayModalBody"></div>
      <div class="modal-footer">
        <a href="#" id="addReservationBtn" class="btn btn-primary-ars">
          <i class="bi bi-plus me-1"></i><span data-i18n="t_add_for_day">إضافة حجز لهذا اليوم</span>
        </a>
        <button class="btn btn-secondary" data-bs-dismiss="modal"><span data-i18n="t_close">إغلاق</span></button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
const currentUserId = {{ current_user.id }};
let activeFilter = 'all';

document.addEventListener('DOMContentLoaded', function() {
  const cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
    locale: (localStorage.getItem('ars_lang')||'ar')==='ar' ? 'ar' : 'en', direction: (localStorage.getItem('ars_lang')||'ar')==='ar' ? 'rtl' : 'ltr', initialView:'dayGridMonth', height:650,
    headerToolbar:{right:'prev,next today',center:'title',left:'dayGridMonth,timeGridWeek,timeGridDay,listWeek'},
    events: function(info, success, failure) {
      const vid = document.getElementById('venueFilter').value;
      const filter = activeFilter;
      fetch('/calendar/events?start='+info.startStr+'&end='+info.endStr+'&venue_id='+vid+'&filter='+filter)
        .then(r=>r.json())
        .then(data => {
          // Color code events
          data.forEach(ev => {
            if (ev.extendedProps?.type === 'blocked') {
              ev.backgroundColor = '#7c3aed'; ev.borderColor = '#5b21b6';
              ev.textColor = '#fff';
            } else if (ev.extendedProps?.status === 'approved') {
              const isMine = ev.extendedProps?.user_id === currentUserId;
              if (isMine) {
                ev.backgroundColor = '#d97706'; ev.borderColor = '#b45309'; ev.textColor = '#fff';
              } else {
                ev.backgroundColor = '#059669'; ev.borderColor = '#047857'; ev.textColor = '#fff';
              }
            } else if (ev.extendedProps?.status === 'pending') {
              ev.backgroundColor = '#ea580c'; ev.borderColor = '#c2410c'; ev.textColor = '#fff';
            } else if (ev.extendedProps?.status === 'rejected') {
              ev.backgroundColor = '#7a6b00'; ev.borderColor = '#5a4b00'; ev.textColor = '#fff';
            } else if (ev.extendedProps?.status === 'cancelled') {
              ev.backgroundColor = '#64748b'; ev.borderColor = '#475569'; ev.textColor = '#fff';
            } else if (ev.extendedProps?.status === 'completed') {
              ev.backgroundColor = '#0284c7'; ev.borderColor = '#0369a1'; ev.textColor = '#fff';
            }
          });
          success(data);
        }).catch(failure);
    },
    eventClick: function(info) {
      if (info.event.url) { window.location.href = info.event.url; info.jsEvent.preventDefault(); }
    },
    dateClick: function(info) {
      // Show day detail modal
      const modal = new bootstrap.Modal(document.getElementById('dayModal'));
      const date = info.dateStr;
      document.getElementById('dayModalTitle').textContent = 'تفاصيل يوم ' + date;
      document.getElementById('addReservationBtn').href = '/reservations/new?date=' + date;
      // Load events for this day
      const events = cal.getEvents().filter(e => {
        const s = e.startStr.split('T')[0];
        return s === date;
      });
      let html = '';
      if (events.length === 0) {
        html = '<p class="text-muted text-center py-3"><span data-i18n="t_no_day_bookings">لا توجد حجوزات في هذا اليوم ✅</span></p>';
      } else {
        html = '<div class="list-group">';
        events.forEach(e => {
          const color = e.backgroundColor || '#1A555C';
          html += `<a href="${e.url || '#'}" class="list-group-item list-group-item-action d-flex gap-3 align-items-center">
            <span style="width:12px;height:12px;border-radius:50%;background:${color};flex-shrink:0"></span>
            <div>
              <div class="fw-bold small">${e.title}</div>
              <div class="text-muted" style="font-size:.75rem">${e.startStr.split('T')[1]||''} — ${(e.extendedProps?.venue||'')}</div>
            </div>
          </a>`;
        });
        html += '</div>';
      }
      document.getElementById('dayModalBody').innerHTML = html;
      modal.show();
    },
    eventDidMount: function(info) {
      // Tooltip on hover
      const venue = info.event.extendedProps?.venue || '';
      const status = info.event.extendedProps?.status || '';
      const user = info.event.extendedProps?.user_name || '';
      info.el.title = [info.event.title, venue, status, user].filter(Boolean).join(' | ');
    }
  });
  cal.render();

  document.getElementById('venueFilter').addEventListener('change', ()=>cal.refetchEvents());

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      activeFilter = this.dataset.filter;
      cal.refetchEvents();
    });
  });
});
</script>
{% endblock %}

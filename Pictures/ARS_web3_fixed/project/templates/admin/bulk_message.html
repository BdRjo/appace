{% extends 'base.html' %}
{% block title %}رسالة جماعية — ARS{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="bi bi-envelope-paper me-2"></i>إرسال رسالة جماعية</h1>
</div>

<div class="card">
  <div class="card-header">📧 إرسال بريد إلكتروني للمستخدمين</div>
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label fw-bold"><span data-i18n="t_subject">الموضوع</span> <span class="text-danger">*</span></label>
          <input type="text" name="subject" class="form-control" required
                 placeholder="موضوع الرسالة...">
        </div>
        <div class="col-12">
          <label class="form-label fw-bold">نص الرسالة <span class="text-danger">*</span></label>
          <textarea name="body" class="form-control" rows="8" required
                    placeholder="اكتب نص الرسالة هنا..."></textarea>
        </div>
        <div class="col-12">
          <label class="form-label fw-bold">المستلمون</label>
          <div class="mb-2 d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="recipient"
                     value="all" id="recpAll" checked onchange="toggleUsers(false)">
              <label class="form-check-label" for="recpAll">
                جميع المستخدمين النشطين ({{ users|length }})
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="recipient"
                     value="selected" id="recpSel" onchange="toggleUsers(true)">
              <label class="form-check-label" for="recpSel">مستخدمون محددون</label>
            </div>
          </div>
          <div id="userListDiv" style="display:none;max-height:220px;overflow-y:auto;
               border:1px solid #dee2e6;border-radius:8px;padding:12px;">
            {% for u in users %}
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="user_ids"
                     value="{{ u.id }}" id="usr{{ u.id }}">
              <label class="form-check-label" for="usr{{ u.id }}">
                {{ u.full_name }} — <span class="text-muted small">{{ u.email or '—' }}</span>
              </label>
            </div>
            {% endfor %}
          </div>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-success px-4"
                onclick="return confirm('هل تريد إرسال الرسالة؟ سيتم الإرسال بالخلفية.')">
          <i class="bi bi-send me-1"></i>📧 إرسال
        </button>
        <a href="{{ url_for('users.index') }}" class="btn btn-secondary px-4"><span data-i18n="t_cancel">إلغاء</span></a>
      </div>
    </form>
  </div>
</div>

<script>
function toggleUsers(show) {
  document.getElementById('userListDiv').style.display = show ? 'block' : 'none';
}
</script>
{% endblock %}
